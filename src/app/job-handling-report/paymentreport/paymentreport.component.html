<div class="container-fluid">
    <mat-card class="matcard mt-2">
        <mat-card-content>

            <h2 class="head">Payment Report</h2>

            <form [formGroup]="reportForm" (ngSubmit)="getReport()">
                <div class="row">
                    <div class="col-sm-3">
                        <div>
                            <label>From Date <span
                                    class="text-danger">*</span></label>
                        </div>
                        <div>
                            <input type="date"
                                [ngClass]="{'is-invalid':reportForm.controls.fromdate.touched && reportForm.controls.fromdate.errors}"
                                class="form-control"
                                formControlName="fromdate" required />
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div>
                            <label>TO Date <span
                                    class="text-danger">*</span></label>
                        </div>
                        <div>
                            <input
                                [ngClass]="{'is-invalid':reportForm.controls.todate.touched && reportForm.controls.todate.errors}"
                                class="form-control" type="date"
                                formControlName="todate" required />
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="pt-3">
                            <div class="inputdiv">
                                <mat-form-field>
                                    <mat-label>Party Name</mat-label>
                                    <mat-select
                                        [ngClass]="{'is-invalid':reportForm.controls.third_partyid.touched && reportForm.controls.third_partyid.errors}"
                                        formControlName="third_partyid" #awval
                                        required>
                                        <mat-form-field>
                                            <input matInput type="text" #auval
                                                (input)="suggest(auval.value)"
                                                placeholder="Search...">
                                        </mat-form-field>

                                        <mat-option [value]=0>All</mat-option>

                                        <mat-option
                                            [value]="option.third_partyid"
                                            *ngFor="let option of suggestions">
                                            {{option.party_name}}
                                        </mat-option>
                                    </mat-select>
                                </mat-form-field>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-3">
                        <div class="pt-4 pl-4">
                            <button type="submit" class="btn btn-info pl-4 pr-4">Search</button>
                        </div>
                    </div>
                </div>
            </form>

            <div class="row">
                <div class="col-sm-9">
                    <button class="btn btn-info btn-sm ml-3"
                        printSectionId="_print_section" ngxPrint
                        [useExistingCss]="true">
                        <mat-icon>print</mat-icon>
                    </button>
                </div>

                <div class="table-responsive col-sm-12" id="_print_section">
                    <table style="width: 100%;"
                        class="table table-bordered table-hover">
                        <thead class="tableheadList">
                            <tr>
                                <th>Si No</th>
                                <th>Payment Date</th>
                                <th>Customer Name</th>
                                <th>Bank Name</th>
                                <th>Amount</th>
                                <th>Description</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr
                                *ngFor="let item of thirdPartyPayment; let i = index">
                                <td>{{ i + 1 }}</td>
                                <td>{{getFormattedDate(item.date)}}</td>
                                <td>{{ item.party_name }}</td>
                                <td>{{item.bank_name}}</td>
                                <td>{{item.deduction_amount}}</td>
                                <td>{{item.description}}</td>
                                <td class="disnon"><button
                                        class="btn btn-sm btn-danger"
                                        (click)="deleteClick(item.paymentid)">Remove</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>
